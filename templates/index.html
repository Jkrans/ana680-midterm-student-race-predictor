<!DOCTYPE html>
<html>
<head>
  <title>Student Race/Ethnicity Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:0; }
    .card { width:420px; margin:60px auto; background:#fff; padding:24px; border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08); }
    h2 { margin:0 0 10px; color:#222; }
    p { margin:0 0 18px; color:#555; }
    label { display:block; margin:12px 0 6px; font-weight:bold; color:#333; }
    input { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
    button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px;
             background:#2563eb; color:white; font-size:16px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .result { margin-top:18px; padding:12px; border-radius:10px; background:#e8f0ff; color:#123; text-align:center; }
    .note { font-size:12px; color:#777; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Race/Ethnicity Prediction</h2>
    <p>Enter the student’s scores (0–100).</p>

    <form action="/predict" method="POST">
      <label>Math score</label>
      <input name="math_score" type="number" min="0" max="100" required>

      <label>Reading score</label>
      <input name="reading_score" type="number" min="0" max="100" required>

      <label>Writing score</label>
      <input name="writing_score" type="number" min="0" max="100" required>

      <button type="submit">Predict</button>
    </form>

    {% if result %}
  <div class="result">
    Predicted race/ethnicity: <b>{{ result }}</b>
    <div style="font-size:12px; color:#555; margin-top:6px;">
      (Dataset uses anonymized groups A–E)
    </div>
  </div>
{% endif %}

    <div class="note">
      Model uses only test scores, so accuracy is limited.
    </div>
  </div>
</body>
</html>
